name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 9 * * 1,4'  # 매주 월/목 오전 9시 (UTC) — 7일 제한보다 짧게 2회
  workflow_dispatch:         # GitHub UI에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            "https://ugowzkpuymwuqoqwkvfi.supabase.co/auth/v1/health")
          echo "$RESPONSE"
          echo "Ping sent — Supabase keep-alive complete."
